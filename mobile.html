<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مسح الرمز — فارسي‌آموز</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      background: white;
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 90%;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }
    #qrcode {
      display: inline-flex;
      padding: 16px;
      background: #f8fafc;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    #qrcode img, #qrcode canvas {
      display: block;
      width: 220px !important;
      height: 220px !important;
    }
    .url {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      word-break: break-all;
      direction: ltr;
      font-family: monospace;
    }
    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: #94a3b8;
    }
    .hint svg { width: 18px; height: 18px; flex-shrink: 0; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 14px;
      background: #e2e8f0;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 فارسي‌آموز</h1>
    <p>امسح الرمز لفتح التطبيق على هاتفك</p>
    <div id="qrcode"></div>
    <div class="url" id="urlDisplay"></div>
    <div class="hint">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" />
      </svg>
      <span>صوِّب كاميرا هاتفك نحو الرمز</span>
    </div>
    <div class="badge">نفس شبكة Wi-Fi مطلوبة</div>
  </div>

  <script>
    const url = window.location.origin
    document.getElementById('urlDisplay').textContent = url
    new QRCode(document.getElementById('qrcode'), {
      text: url,
      width: 220,
      height: 220,
      colorDark: '#0f172a',
      colorLight: '#f8fafc',
    })
  </script>
</body>
</html>
